name: scm-leave
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-scm_leave}
      MYSQL_USER: ${DB_USER:-scm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run bash scripts/start.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bash scripts/start.sh first}
      TZ: Asia/Bangkok
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--max-allowed-packet=16M',
      ]
    ports: ['127.0.0.1:${MYSQL_PORT:-3307}:3306']
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 35
      start_period: 25s
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 4000
      DB_SSL: 'false'
      NODE_ENV: development
    ports: ['127.0.0.1:${API_PORT:-4000}:4000']
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-4000}/api
    restart: unless-stopped
    ports: ['127.0.0.1:${WEB_PORT:-5173}:80']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 10
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports: ['127.0.0.1:${PMA_PORT:-8088}:80']
    depends_on:
      mysql: { condition: service_healthy }
volumes:
  mysql_data:
