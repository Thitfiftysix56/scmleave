# Disposable test database; no host ports and no production .env file.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scm_leave_test
      MYSQL_ROOT_PASSWORD: ${TEST_DB_PASSWORD:?Use scripts/test-integration.sh}
      MYSQL_ROOT_HOST: '%'
    tmpfs: ['/var/lib/mysql']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent',
        ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
  tests:
    build:
      context: .
      dockerfile: api/Dockerfile.test
    environment:
      RUN_INTEGRATION: '1'
      DB_NAME: scm_leave_test
      DB_USER: root
      DB_PASSWORD: ${TEST_DB_PASSWORD}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_SSL: 'false'
    depends_on:
      mysql: { condition: service_healthy }
